<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        viewport-fit=cover
    "
>

<title>Divisor de Gastos</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
}

h1,h2,h3{
    margin-top:0;
}

.card{
    background:#2b2b2b;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
}

input,
select,
button{

    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
    background:#3a3a3a;
    color:white;

    font-size:16px;
}

button{
    background:#4caf50;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.small-btn{
    width:auto;
    padding:6px 10px;
    font-size:12px;
    background:#ff5555;
}

.person{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #444;
}

.saldo-positivo{
    color:#4caf50;
}

.saldo-negativo{
    color:#ff6b6b;
}

.gasto{
    border:1px solid #444;
    border-radius:10px;
    padding:10px;
    margin-top:10px;
}

.checkbox-group{
    margin-top:10px;
}

.checkbox-group label{
    display:block;
    margin-top:5px;
}

.reset-btn{
    background:#ff9800;
}

small{
    opacity:0.8;
}

</style>

</head>

<body>

<h1>💸 Divisor de Gastos</h1>

<div class="card">

    <h2>Agregar persona</h2>

    <input
        type="text"
        id="personaInput"
        placeholder="Nombre"
    >

    <button onclick="agregarPersona()">
        Agregar
    </button>

</div>

<div class="card">

    <h2>Balances</h2>

    <div id="balancesContainer"></div>

</div>

<div class="card">

    <h2>Nuevo gasto</h2>

    <input
        type="text"
        id="descInput"
        placeholder="Descripción"
    >

    <input
        type="number"
        id="montoInput"
        placeholder="Monto"
        step="0.01"
        inputmode="decimal"
    >

    <select id="pagadorSelect"></select>

    <div
        class="checkbox-group"
        id="participantesContainer">
    </div>

    <button onclick="crearGasto()">
        Crear gasto
    </button>

</div>

<div class="card">

    <h2>Registrar pago</h2>

    <select id="personaPagoSelect"></select>

    <input
        type="number"
        id="montoPagoInput"
        placeholder="Monto pagado"
        step="0.01"
        inputmode="decimal"
    >

    <button onclick="registrarPago()">
        Registrar pago
    </button>

</div>

<div class="card">

    <h2>Gastos activos</h2>

    <div id="gastosContainer"></div>

</div>

<div class="card">

    <button
        class="reset-btn"
        onclick="resetearTodo()">

        Resetear todo

    </button>

</div>

<script>

let personas =
JSON.parse(localStorage.getItem("personas"))
||
[
    {
        id:0,
        nombre:"Yo",
        fijo:true
    }
];

let gastos =
JSON.parse(localStorage.getItem("gastos"))
||
[];

let pagos =
JSON.parse(localStorage.getItem("pagos"))
||
[];

let deudas =
JSON.parse(localStorage.getItem("deudas"))
||
[];

function guardar(){

    localStorage.setItem(
        "personas",
        JSON.stringify(personas)
    );

    localStorage.setItem(
        "gastos",
        JSON.stringify(gastos)
    );

    localStorage.setItem(
        "pagos",
        JSON.stringify(pagos)
    );

    localStorage.setItem(
        "deudas",
        JSON.stringify(deudas)
    );
}

function agregarPersona(){

    const nombre =
    document.getElementById(
        "personaInput"
    ).value.trim();

    if(!nombre) return;

    personas.push({

        id:Date.now(),

        nombre:nombre,

        fijo:false

    });

    document.getElementById(
        "personaInput"
    ).value = "";

    guardar();
    render();
}

function eliminarPersona(id){

    const persona =
    personas.find(p => p.id === id);

    if(persona.fijo){

        alert("No se puede eliminar.");

        return;
    }

    personas =
    personas.filter(p => p.id !== id);

    gastos.forEach(g => {

        g.participantes =
        g.participantes.filter(
            p => p.id !== id
        );

    });

    pagos =
    pagos.filter(
        p => p.personaId !== id
    );

    deudas =
    deudas.filter(
        d => d.personaId !== id
    );

    guardar();
    render();
}

function crearGasto(){

    const descripcion =
    document.getElementById(
        "descInput"
    ).value.trim();

    const monto =
    parseFloat(
        document.getElementById(
            "montoInput"
        ).value
    );

    const pagadorId =
    parseInt(
        document.getElementById(
            "pagadorSelect"
        ).value
    );

    const checks =
    document.querySelectorAll(
        ".participanteCheck:checked"
    );

    if(
        !descripcion ||
        isNaN(monto) ||
        checks.length === 0
    ){
        return;
    }

    const division =
    monto / checks.length;

    const participantes = [];

    checks.forEach(c => {

        const id =
        parseInt(c.value);

        if(id !== pagadorId){

            participantes.push({

                id:id,

                deuda:division

            });

            deudas.push({

                id:Date.now() + Math.random(),

                personaId:id,

                monto:division

            });
        }

    });

    gastos.push({

        id:Date.now(),

        descripcion:descripcion,

        total:monto,

        pagadorId:pagadorId,

        participantes:participantes

    });

    document.getElementById(
        "descInput"
    ).value = "";

    document.getElementById(
        "montoInput"
    ).value = "";

    guardar();
    render();
}

function registrarPago(){

    const personaId =
    parseInt(
        document.getElementById(
            "personaPagoSelect"
        ).value
    );

    const monto =
    parseFloat(
        document.getElementById(
            "montoPagoInput"
        ).value
    );

    if(
        isNaN(monto) ||
        monto <= 0
    ){
        return;
    }

    pagos.push({

        id:Date.now(),

        personaId:personaId,

        monto:monto

    });

    document.getElementById(
        "montoPagoInput"
    ).value = "";

    guardar();
    render();
}

function calcularBalance(personaId){

    let deuda = 0;

    let pagosRealizados = 0;

    deudas.forEach(d => {

        if(d.personaId === personaId){

            deuda += d.monto;

        }

    });

    pagos.forEach(p => {

        if(p.personaId === personaId){

            pagosRealizados += p.monto;

        }

    });

    return deuda - pagosRealizados;
}

function eliminarGasto(id){

    gastos =
    gastos.filter(
        g => g.id !== id
    );

    guardar();
    render();
}

function renderBalances(){

    const container =
    document.getElementById(
        "balancesContainer"
    );

    container.innerHTML = "";

    personas.forEach(p => {

        const balance =
        calcularBalance(p.id);

        let clase =
        "saldo-positivo";

        if(balance > 0){

            clase =
            "saldo-negativo";
        }

        let texto = "";

        if(balance > 0){

            texto =
            `Debe $${balance.toFixed(2)}`;

        }
        else if(balance < 0){

            texto =
            `A favor $${Math.abs(balance).toFixed(2)}`;

        }
        else{

            texto =
            "Saldado";
        }

        container.innerHTML += `

            <div class="person">

                <div>

                    <b>${p.nombre}</b>

                    <br>

                    <span class="${clase}">
                        ${texto}
                    </span>

                </div>

                ${
                    !p.fijo
                    ?
                    `
                    <button
                        class="small-btn"
                        onclick="eliminarPersona(${p.id})">

                        X

                    </button>
                    `
                    :
                    ""
                }

            </div>

        `;
    });
}

function renderSelects(){

    const pagador =
    document.getElementById(
        "pagadorSelect"
    );

    const pago =
    document.getElementById(
        "personaPagoSelect"
    );

    pagador.innerHTML = "";

    pago.innerHTML = "";

    personas.forEach(p => {

        pagador.innerHTML += `

            <option value="${p.id}">
                ${p.nombre}
            </option>

        `;

        pago.innerHTML += `

            <option value="${p.id}">
                ${p.nombre}
            </option>

        `;
    });

    const participantes =
    document.getElementById(
        "participantesContainer"
    );

    participantes.innerHTML = "";

    personas.forEach(p => {

        participantes.innerHTML += `

            <label>

                <input
                    type="checkbox"
                    class="participanteCheck"
                    value="${p.id}"
                    ${p.id === 0 ? "checked" : ""}
                >

                ${p.nombre}

            </label>

        `;
    });
}

function renderGastos(){

    const container =
    document.getElementById(
        "gastosContainer"
    );

    container.innerHTML = "";

    gastos.forEach(g => {

        const pagador =
        personas.find(
            p => p.id === g.pagadorId
        );

        let html = `

            <div class="gasto">

                <h3>
                    ${g.descripcion}
                </h3>

                <div>
                    Pagó:
                    <b>${pagador?.nombre}</b>
                </div>

                <div>
                    Total:
                    <b>$${g.total.toFixed(2)}</b>
                </div>

                <br>

        `;

        g.participantes.forEach(p => {

            const persona =
            personas.find(
                x => x.id === p.id
            );

            html += `

                <div>

                    ${persona?.nombre}
                    →
                    $${p.deuda.toFixed(2)}

                </div>

            `;
        });

        html += `

            <br>

            <button
                class="small-btn"
                onclick="eliminarGasto(${g.id})">

                Eliminar gasto

            </button>

            </div>

        `;

        container.innerHTML += html;
    });
}

function resetearTodo(){

    const confirmar =
    confirm(
        "¿Borrar todos los datos?"
    );

    if(!confirmar) return;

    localStorage.clear();

    location.reload();
}

function render(){

    renderBalances();

    renderSelects();

    renderGastos();
}

render();

</script>

</body>
</html>
